    <title>Inklly — QR ordering and one-click printing for print shops</title>
    <meta name="description" content="Customers scan your shop's QR code, upload and edit their documents, and pay from their phone. You pick the printer and press print. No app, no pen drives, no commission." />
    <meta property="og:site_name" content="Inklly" />
    <meta property="og:title" content="Inklly — The print counter without the queue" />
    <meta property="og:description" content="Customers scan your shop's QR code, upload and edit their documents, and pay from their phone. You pick the printer and press print." />

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('inklly_theme');
          if (saved === 'dark' || (!saved && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (_) {}
      })();
    </script>
  </head>
  <body class="bg-[#F7F8FA] text-[#182230] antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
